services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: exchange_java
      MYSQL_USER: exchange
      MYSQL_PASSWORD: exchange
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - exchange-java-mysql:/var/lib/mysql

  kafka:
    image: apache/kafka-native:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': > /dev/tcp/127.0.0.1/9092'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${EXCHANGE_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["app"]
    build:
      context: .
    environment:
      EXCHANGE_DB_URL: jdbc:mysql://mysql:3306/exchange_java?useSSL=false&allowPublicKeyRetrieval=true
      EXCHANGE_DB_USER: exchange
      EXCHANGE_DB_PASSWORD: exchange
      EXCHANGE_KAFKA_BOOTSTRAP: kafka:29092
      EXCHANGE_REDIS_HOST: redis
      EXCHANGE_REDIS_PORT: 6379
      EXCHANGE_MESSAGING_ENABLED: "true"
      EXCHANGE_DEMO_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: observability
      EXCHANGE_JWT_SECRET: ${EXCHANGE_JWT_SECRET:-local-compose-secret-change-before-deployment}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    profiles: ["app"]
    build:
      context: frontend
    ports:
      - "4173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  exchange-java-mysql:
